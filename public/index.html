<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>whiteboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="surface">
    <canvas id="board"></canvas>

    <!-- other people's cursors get drawn here as small floating tags,
         positioned in real screen coordinates rather than on the canvas
         itself, so they never get "drawn into" the artwork -->
    <div id="cursorLayer"></div>

    <!-- the tool tray sits at the bottom edge of the drawing surface for
         two concrete, non-decorative reasons: it stays out of the visual
         field while you're looking at what you're drawing, and it sits in
         comfortable thumb reach on touch devices. -->
    <div class="tray" id="tray">

      <div class="tool-group" id="colorRow" role="radiogroup" aria-label="Marker colour"></div>

      <div class="tool-group width-control">
        <input type="range" id="widthSlider" min="2" max="16" value="4" aria-label="Marker thickness" />
        <span class="width-preview" aria-hidden="true"><span class="width-dot" id="widthDot"></span></span>
        <span class="width-value" id="widthValue">4px</span>
      </div>

      <button id="eraserBtn" class="tool-btn" aria-pressed="false">Eraser</button>

      <!-- connection status has a fixed-width slot so "Reconnecting…"
           appearing/disappearing never shifts anything next to it -->
      <span class="connection-status" id="connectionStatus" aria-live="polite"></span>

      <div class="tray-secondary" id="traySecondary">
        <div class="presence" id="presenceList" aria-live="polite"></div>
        <button id="clearBtn" class="tool-btn danger">Clear board</button>
      </div>

      <button id="moreBtn" class="tool-btn more-btn" aria-expanded="false" aria-controls="traySecondary" aria-label="More options">⋯</button>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
